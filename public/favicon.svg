<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep blue gradient for the location pin -->
    <linearGradient id="gradPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" /> <!-- Blue 600 -->
      <stop offset="100%" stop-color="#1e3a8a" /> <!-- Blue 900 -->
    </linearGradient>
    
    <!-- Vibrant bright blue for the intersecting road -->
    <linearGradient id="gradRoad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" /> <!-- Light Blue 400 -->
      <stop offset="100%" stop-color="#0284c7" /> <!-- Light Blue 600 -->
    </linearGradient>
    
    <!-- Shadow for 3D layered depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- The Outer Location Pin (Destination & Logistics) -->
  <path d="M 256 48 C 160 48, 80 128, 80 224 C 80 348, 256 464, 256 464 C 256 464, 432 348, 432 224 C 432 128, 352 48, 256 48 Z" 
        fill="url(#gradPin)" filter="url(#shadow)"/>
        
  <!-- The Inner Cutout (Creating the ring of the pin) -->
  <path d="M 140 224 C 140 160, 192 108, 256 108 C 320 108, 372 160, 372 224 C 372 264, 330 320, 256 390 C 182 320, 140 264, 140 224 Z" 
        fill="#ffffff" />
        
  <!-- The Swooping Highway (Dynamic Transit Flow) -->
  <path d="M 40 320 C 180 360, 260 160, 472 160" 
        fill="none" stroke="url(#gradRoad)" stroke-width="48" stroke-linecap="round" filter="url(#shadow)"/>
        
  <!-- Highway Center Dashed Line -->
  <path d="M 40 320 C 180 360, 260 160, 472 160" 
        fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-dasharray="16, 24" />
        
  <!-- Central Operations Hub marker on the road -->
  <circle cx="280" cy="225" r="24" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="280" cy="225" r="12" fill="url(#gradPin)"/>
</svg>